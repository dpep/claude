# statusbar-core — pure rendering for the `statusbar` status line.
#
# Claude Code pipes session JSON to a statusLine command on stdin; this
# crate turns that JSON (plus a git branch and clock the CLI supplies)
# into the ANSI string rendered at the bottom of the terminal. All logic
# is here and unit-tested; the `-cli` crate is thin stdin/stdout glue.

[package]
name = "statusbar-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
